<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tying Recipe — 타잉 레시피 카드</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+KR:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  [data-theme="dark"] {
    --bg: #0a0a0b;
    --surface: #141416;
    --surface-hover: #1c1c20;
    --border: #2a2a2e;
    --border-hover: #3a3a40;
    --text: #e4e4e7;
    --text-dim: #71717a;
    --accent: #ef4444;
    --accent-soft: rgba(239,68,68,0.12);
    --blue: #3b82f6;
    --blue-soft: rgba(59,130,246,0.12);
  }
  [data-theme="light"] {
    --bg: #f4f4f2;
    --surface: #ffffff;
    --surface-hover: #f9f9f7;
    --border: #ddddd9;
    --border-hover: #c5c5c0;
    --text: #1c1c1e;
    --text-dim: #6e6e80;
    --accent: #dc2626;
    --accent-soft: rgba(220,38,38,0.07);
    --blue: #2563eb;
    --blue-soft: rgba(37,99,235,0.07);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    transition: background 0.35s, color 0.25s;
  }

  .container { max-width: 860px; margin: 0 auto; padding: 60px 24px 80px; }

  /* Theme Toggle */
  .theme-toggle {
    position: fixed; top: 20px; right: 20px; z-index: 100;
    width: 48px; height: 48px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--surface);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 20px; transition: all 0.2s;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
  }
  .theme-toggle:hover { border-color: var(--border-hover); transform: scale(1.08); }

  /* Header */
  .header { margin-bottom: 48px; }
  .header h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px; font-weight: 600; letter-spacing: 2px;
    text-transform: uppercase; color: var(--text-dim); margin-bottom: 12px;
  }
  .header h2 { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 8px; }
  .header p { color: var(--text-dim); font-size: 15px; font-weight: 300; line-height: 1.6; }
  .header p a { color: var(--blue); text-decoration: none; border-bottom: 1px solid rgba(59,130,246,0.3); }

  /* Stats */
  .stats {
    display: flex; gap: 1px; background: var(--border);
    border-radius: 10px; overflow: hidden; margin-bottom: 48px;
  }
  .stat { flex: 1; background: var(--surface); padding: 20px 24px; text-align: center; transition: background 0.25s; }
  .stat-number { font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 600; }
  .stat-label { font-size: 12px; color: var(--text-dim); margin-top: 4px; letter-spacing: 0.5px; }

  /* Section */
  .section-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--text-dim); padding-bottom: 12px;
    border-bottom: 1px solid var(--border); margin-bottom: 20px;
  }

  /* Card Grid */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 16px;
    margin-bottom: 40px;
  }

  /* Gallery Card */
  .gallery-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    display: block;
  }
  .gallery-card:hover {
    border-color: var(--border-hover);
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  }

  .gallery-thumb {
    width: 100%;
    height: 200px;
    overflow: hidden;
    background: linear-gradient(135deg, #1a3a5c, #0f2234);
  }
  .gallery-thumb img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform 0.3s;
  }
  .gallery-card:hover .gallery-thumb img { transform: scale(1.06); }

  .gallery-info { padding: 16px 18px 18px; }

  .gallery-category {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); background: var(--accent-soft);
    display: inline-block; padding: 2px 7px; border-radius: 3px;
    margin-bottom: 8px;
  }
  .gallery-category.streamer { color: var(--blue); background: var(--blue-soft); }
  .gallery-category.nymph { color: #f59e0b; background: rgba(245,158,11,0.1); }
  .gallery-category.dry-fly { color: #10b981; background: rgba(16,185,129,0.1); }

  .gallery-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.2px; }
  .gallery-desc { font-size: 12px; color: var(--text-dim); font-weight: 300; line-height: 1.4; }
  .gallery-meta {
    display: flex; gap: 12px; margin-top: 10px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim);
  }

  /* Empty */
  .empty-section {
    background: var(--surface); border: 1px dashed var(--border);
    border-radius: 12px; padding: 32px; text-align: center;
    color: var(--text-dim); font-size: 13px; margin-bottom: 40px;
  }

  /* Footer */
  .footer {
    margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--border);
    text-align: center; color: var(--text-dim); font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
  }
  .footer a { color: var(--blue); text-decoration: none; }

  @media (max-width: 640px) {
    .card-grid { grid-template-columns: 1fr; }
    .stats { flex-direction: column; }
    .container { padding: 40px 16px 60px; }
    .theme-toggle { top: 12px; right: 12px; width: 42px; height: 42px; font-size: 18px; }
  }
</style>
</head>
<body>

<button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">🌙</button>

<div class="container">

  <div class="header">
    <h1>🪝 tying recipe</h1>
    <h2>타잉 레시피 카드</h2>
    <p>재료와 순서만 간결하게. 전략·분석은 <a href="https://github.com/CADDIS-GR/fly-tying-archive">Fly Tying Archive</a>에서.</p>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-number">1</div><div class="stat-label">Cards</div></div>
    <div class="stat"><div class="stat-number">1</div><div class="stat-label">Categories</div></div>
    <div class="stat"><div class="stat-number">2026</div><div class="stat-label">Season</div></div>
  </div>

  <!-- ===== CHIRONOMID ===== -->
  <div class="section-title">chironomid</div>
  <div class="card-grid">

    <a href="patterns/chironomid/red-wire-chironomid/" class="gallery-card">
      <div class="gallery-thumb">
        <img src="photos/red-wire-chironomid.jpg" alt="Red Wire Chironomid">
      </div>
      <div class="gallery-info">
        <div class="gallery-category">chironomid</div>
        <div class="gallery-name">Red Wire Chironomid</div>
        <div class="gallery-desc">블랙 바디 + 레드 와이어 리빙. 화이트 브리더 윙.</div>
        <div class="gallery-meta">
          <span>#14</span>
          <span>2026-02-06</span>
        </div>
      </div>
    </a>

    <!-- 새 카드 추가 시 여기에 복사 -->

  </div>

  <!-- ===== STREAMER ===== -->
  <div class="section-title">streamer</div>
  <div class="empty-section">아직 등록된 카드 없음</div>

  <!-- ===== NYMPH ===== -->
  <div class="section-title">nymph</div>
  <div class="empty-section">아직 등록된 카드 없음</div>

  <!-- ===== DRY FLY ===== -->
  <div class="section-title">dry fly</div>
  <div class="empty-section">아직 등록된 카드 없음</div>

  <div class="footer">
    CADDIS-GR / <a href="https://github.com/CADDIS-GR/tying-recipe">tying-recipe</a>
  </div>

</div>

<script>
function toggleTheme() {
  const html = document.documentElement;
  const btn = document.getElementById('themeBtn');
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  btn.textContent = isDark ? '☀️' : '🌙';
}
</script>
</body>
</html>
